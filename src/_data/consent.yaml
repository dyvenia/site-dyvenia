message: >-
  We use necessary technologies to operate our websites. With your consent, we also use optional
  technologies for meeting scheduling and for marketing measurement. Meta Pixel, deployed via Google
  Tag Manager, helps us measure conversions, optimize ads, and remarket to website visitors. Plausible
  Analytics provides aggregate website statistics without cookies or persistent identifiers. You can
  accept all optional technologies, reject them, or manage your preferences. You can change your choice
  at any time. Learn more in our <a href="/privacy/">privacy policy</a>.
