# Sveltia CMS configuration

# This is where we configure the CMS repo and its collections and fields
# Sveltia CMS generally follows the Decap CMS configuration spec
# Decap CMS docs: https://decapcms.org/docs/intro/
# Sveltia CMS docs: https://github.com/sveltia/sveltia-cms#features

local_backend: true
backend:
  name: github
  repo: dyvenia/site-dyvenia
  branch: content
media_folder: /src/assets/images/
public_folder: /assets/images/
collections:
  - name: home
    label: Home Page
    icon: home
    create: false
    extension: njk
    format: frontmatter
    files:
      - file: src/pages/index.njk
        label: Home
        name: home
        fields:
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
          - label: Layout
            name: layout
            widget: hidden
            default: modular
          - label: Permalink
            name: permalink
            widget: hidden
          - label: Body Class
            name: bodyClass
            widget: hidden
          - label: Main Class
            name: mainClass
            widget: hidden
          - label: Sections
            name: sections
            widget: list
            collapsed: true
            summary: "{{fields.type}}: {{fields.internal_name | default('{{fields.title}}')}}"
            types:
              - label: Hero
                name: hero
                widget: object
                fields:
                  - label: Internal name
                    name: internal_name
                    widget: string
                    required: false
                    hint: Only visible in CMS list view
                  - label: Title
                    name: title
                    widget: markdown
                  - label: Subtitle
                    name: subtitle
                    widget: markdown
                    required: false
                  - label: Button Text
                    name: button_text
                    widget: string
                    required: false
                  - label: Button Target
                    name: button_target
                    widget: string
                    required: false
                  - label: Preset background
                    name: preset_image
                    widget: select
                    required: false
                    dropdown_threshold: 0
                    hint: Stock image from backgrounds/. Custom upload below overrides this.
                    options:
                    - label: — none —
