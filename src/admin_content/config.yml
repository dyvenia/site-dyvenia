  - name: navigation
    label: Navigation
    icon: menu
    extension: yaml
    format: yaml
    files:
      - file: src/_data/navigation.yaml
        label: Site Navigation
        name: navigation
        fields:
          - label: Top Navigation
            name: top
            widget: list
            collapsed: true
            summary: '{{fields.text}}'
            fields:
              - label: Label
                name: text
                widget: string
              - label: URL
                name: url
                widget: string
                required: false
                hint: Leave empty when adding a submenu (becomes functional button, not link)
              - label: Submenu
                name: submenu
                widget: list
                required: false
                collapsed: true
                summary: '{{fields.text}}'
                fields:
                  - label: Label
                    name: text
                    widget: string
                  - label: URL
                    name: url
                    widget: string
          - label: Footer Navigation
            name: bottom
            widget: list
            collapsed: true
            summary: '{{fields.text}}'
            fields:
              - label: Label
                name: text
                widget: string
              - label: URL
                name: url
                widget: string
  - name: meta
    label: Meta Fields
    icon: settings
    extension: yaml
    format: yaml
    files:
      - file: src/_data/meta.yaml
        label: Meta Fields
        name: meta
        fields:
          - label: Book Call Text
            name: book_call
            widget: string
            hint: The text of the book a call button
          - label: Book Call Link
            name: book_call_link
            widget: string
            hint: The link  of the book a call button
          - label: Newsletter Title
            name: newsletter_title
            widget: string
            hint: The title of the newsletter subscription section
          - label: Newsletter Consent Message
            name: newsletter_consent_message
            widget: text
            hint: The message displayed next to the consent checkbox. Supports Markdown links.
          - label: Newsletter Success Message
            name: newsletter_success_message
            widget: string
            hint: Message shown when subscription is successful
          - label: Newsletter Error Message
            name: newsletter_error_message
            widget: string
            hint: Message shown when there is an error submitting the form
          - label: Newsletter Consent Required Message
            name: newsletter_consent_required
            widget: string
            hint: Message shown when the user tries to submit without giving consent
